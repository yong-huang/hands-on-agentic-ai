# judge_labeled — LLM-as-Judge 校准集 (docs/aitest.md 项目 7)
#
# 20 条人工预标注样本: 同一组问题(运维域, 与 golden_v1 的 fact 类同源)配
# 不同质量的回答, 由清单作者人工按 rubric 打 1-5 分。judge 的输出与这
# 份"标准卷答案"对账 —— 对齐率与稳定性都在它上面算。
#
# 打分依据(与 judges/rubric.py 的 RUBRIC 一致):
#   5 正确完整具体可用 / 4 正确但少要点 / 3 方向对但含糊冗余 /
#   2 有明显事实错误或只对极小部分 / 1 答非所问或核心全错
# 分布: 每档 4 条。

schema_version: 1
dataset: judge_labeled
description: judge 校准集, 4 题 × 5 档质量, 人工标注

